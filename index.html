<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>芥川龍之介 文学史クイズ</title>
    <style>
        /* 全体のスタイル設定 */
        body {
            font-family: 'Yu Mincho', 'Sawarabi Mincho', serif;
            background-color: #2c2c2c;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* アプリのメインコンテナ */
        #app-container {
            width: 100%;
            max-width: 800px;
            background-color: #fdfaf5;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            min-height: 600px;
            display: flex;
            flex-direction: column;
        }

        /* ヘッダー部分 */
        header {
            background-color: #8b1c1c;
            color: #fff;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            border-bottom: 4px solid #c8a753;
        }

        /* 画面切り替え用のクラス */
        .screen {
            display: none;
            flex-direction: column;
            flex: 1;
        }
        .screen.active {
            display: flex;
        }

        /* スタート画面の入力フォーム */
        .input-group {
            margin: 15px auto;
            width: 80%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .input-group label {
            font-weight: bold;
            width: 30%;
            text-align: right;
            margin-right: 15px;
        }
        .input-group input, .input-group select {
            width: 60%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: inherit;
        }

        .btn {
            background-color: #8b1c1c;
            color: #fff;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            margin: 30px auto;
            display: block;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #a52a2a;
        }

        /* クイズ画面 */
        #quiz-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0.15;
            z-index: 0;
            transition: background-image 0.5s ease-in-out;
        }

        .quiz-content {
            position: relative;
            z-index: 1;
            padding: 40px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .question-number {
            font-size: 20px;
            color: #8b1c1c;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 22px;
            line-height: 1.6;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .options-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            background-color: rgba(255, 255, 255, 0.9);
            border: 2px solid #c8a753;
            color: #333;
            padding: 15px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            text-align: left;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #c8a753;
            color: #fff;
        }
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        /* 〇×フィードバックのスタイル */
        #feedback-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 250px;
            font-weight: bold;
            z-index: 100;
            display: none;
            pointer-events: none;
            text-shadow: 0px 0px 20px rgba(255, 255, 255, 0.9);
            animation: popIn 0.3s ease-out forwards;
        }
        .feedback-correct { color: #e60012; } /* 赤色 */
        .feedback-incorrect { color: #005bac; } /* 青色 */

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        /* 結果画面 */
        .result-content {
            padding: 40px;
            text-align: center;
        }
        .result-info {
            font-size: 20px;
            margin-bottom: 20px;
            background-color: #f0e6d2;
            padding: 20px;
            border-radius: 10px;
            border: 1px dashed #8b1c1c;
        }
        .score-display {
            font-size: 48px;
            color: #8b1c1c;
            font-weight: bold;
            margin: 20px 0;
        }
        .feedback-text {
            font-size: 18px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

                    <option value="L組">L組</option>

            <div class="input-group">
                <label for="student-name">氏名</label>
                <input type="text" id="student-name" placeholder="例: 芥川 太郎">
